<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chúc mừng 20/10 💖</title>
  <style>
    body {
      background: #000;
      margin: 0;
      overflow: hidden;
      width: 100%;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script>
    // --- Cài đặt canvas ---
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    let cw = window.innerWidth;
    let ch = window.innerHeight;
    canvas.width = cw;
    canvas.height = ch;

    window.addEventListener("resize", () => {
      cw = window.innerWidth;
      ch = window.innerHeight;
      canvas.width = cw;
      canvas.height = ch;
    });

    // --- Cài đặt animation pháo hoa ---
    window.requestAnimFrame = (() => {
      return (
        window.requestAnimationFrame ||
        window.webkitRequestAnimationFrame ||
        window.mozRequestAnimationFrame ||
        function (callback) {
          window.setTimeout(callback, 1000 / 60);
        }
      );
    })();

    let fireworks = [];
    let particles = [];
    let hue = 120;
    let timerTick = 0;

    function random(min, max) {
      return Math.random() * (max - min) + min;
    }

    function calculateDistance(p1x, p1y, p2x, p2y) {
      const xDistance = p1x - p2x;
      const yDistance = p1y - p2y;
      return Math.sqrt(xDistance * xDistance + yDistance * yDistance);
    }

    function Firework(sx, sy, tx, ty) {
      this.x = sx;
      this.y = sy;
      this.sx = sx;
      this.sy = sy;
      this.tx = tx;
      this.ty = ty;
      this.distanceToTarget = calculateDistance(sx, sy, tx, ty);
      this.distanceTraveled = 0;
      this.coordinates = Array(3).fill([this.x, this.y]);
      this.angle = Math.atan2(ty - sy, tx - sx);
      this.speed = 2;
      this.acceleration = 1.05;
      this.brightness = random(50, 70);
    }

    Firework.prototype.update = function (index) {
      const vx = Math.cos(this.angle) * this.speed;
      const vy = Math.sin(this.angle) * this.speed;
      this.speed *= this.acceleration;
      this.distanceTraveled = calculateDistance(this.sx, this.sy, this.x + vx, this.y + vy);
      if (this.distanceTraveled >= this.distanceToTarget) {
        createParticles(this.tx, this.ty);
        fireworks.splice(index, 1);
      } else {
        this.x += vx;
        this.y += vy;
      }
    };

    Firework.prototype.draw = function () {
      ctx.beginPath();
      ctx.moveTo(this.sx, this.sy);
      ctx.lineTo(this.x, this.y);
      ctx.strokeStyle = `hsl(${hue}, 100%, ${this.brightness}%)`;
      ctx.stroke();
    };

    function Particle(x, y) {
      this.x = x;
      this.y = y;
      this.angle = random(0, Math.PI * 2);
      this.speed = random(1, 10);
      this.friction = 0.95;
      this.gravity = 0.6;
      this.hue = random(hue - 20, hue + 20);
      this.brightness = random(50, 80);
      this.alpha = 1;
      this.decay = random(0.0075, 0.009);
    }

    Particle.prototype.update = function (index) {
      this.speed *= this.friction;
      this.x += Math.cos(this.angle) * this.speed;
      this.y += Math.sin(this.angle) * this.speed + this.gravity;
      this.alpha -= this.decay;
      if (this.alpha <= this.decay) {
        particles.splice(index, 1);
      }
    };

    Particle.prototype.draw = function () {
      ctx.beginPath();
      ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${this.hue}, 100%, ${this.brightness}%, ${this.alpha})`;
      ctx.fill();
    };

    function createParticles(x, y) {
      let count = 25;
      while (count--) {
        particles.push(new Particle(x, y));
      }
    }

    // --- Vẽ chữ ---
    function drawText() {
      let fontSize = Math.max(16, cw * 0.05);
      ctx.font = `bold ${fontSize}px 'Comic Sans MS', 'Arial Rounded MT Bold', Arial`;
      ctx.textAlign = "center";
      ctx.fillStyle = "#ff66b2";
      ctx.shadowColor = "rgba(255, 105, 180, 0.7)";
      ctx.shadowBlur = 10;

      const x = cw / 2;
      const y = ch / 2;
      const line = fontSize * 1.3;

      ctx.fillText("🎉 Sắp tới! 🎉", x, y - line * 1.5);
      ctx.fillText("💐 Ngày 20/10 💐", x, y - line * 0.5);
      ctx.fillText("Chúc Bò Tót luôn vui vẻ,", x, y + line * 0.5);
      ctx.fillText("xinh đẹp và hạnh phúc! 💖", x, y + line * 1.5);
    }

    // --- Loop animation ---
    function loop() {
      requestAnimFrame(loop);
      hue += 0.5;
      ctx.globalCompositeOperation = "destination-out";
      ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
      ctx.fillRect(0, 0, cw, ch);
      ctx.globalCompositeOperation = "lighter";

      // Update fireworks
      let i = fireworks.length;
      while (i--) {
        fireworks[i].draw();
        fireworks[i].update(i);
      }

      // Update particles
      i = particles.length;
      while (i--) {
        particles[i].draw();
        particles[i].update(i);
      }

      // Tạo pháo hoa ngẫu nhiên
      if (timerTick % 30 === 0) {
        fireworks.push(new Firework(random(cw / 4, cw * 3 / 4), ch, random(cw / 4, cw * 3 / 4), random(50, ch / 2)));
      }
      timerTick++;

      // Vẽ chữ lên trên cùng
      drawText();
    }

    loop();
  </script>
</body>
</html>
